<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-container" [class.modal-readonly]="isViewMode" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">{{ title }}</h2>
      <button class="modal-close" (click)="onCancel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="row">
        <div class="col-12 col-md-6 mb-3">
          <label class="field-label">Data Entrada</label>
          <div class="input-group input-group-sm input-group-borderless">
            <input class="form-control" formControlName="dataEntrada"
              bsDatepicker [bsConfig]="dpConfig"
              placeholder="dd/mm/aaaa"
              [readonly]="isViewMode" />
            @if (!isViewMode) {
              <span class="input-group-text cursor-pointer">
                <mat-icon class="datepicker-icon">calendar_today</mat-icon>
              </span>
            }
          </div>
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label class="field-label">Valor</label>
          <input type="text" class="form-control form-control-sm" formControlName="valor"
            [class.field-readonly]="isViewMode"
            appCurrencyMask placeholder="R$ 0,00" [readonly]="isViewMode" />
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label class="field-label">Quant. Lançamentos</label>
          <input type="number" class="form-control form-control-sm" formControlName="quantLancamentos"
            [class.field-readonly]="isViewMode"
            placeholder="0" [readonly]="isViewMode" />
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label class="field-label">Usuário Registro</label>
          <input type="text" class="form-control form-control-sm" formControlName="usuarioRegistro"
            [class.field-readonly]="isViewMode"
            placeholder="Usuário" [readonly]="isViewMode" />
        </div>

        @if (showReadonlyFields && editData()) {
          <div class="col-12 col-md-6 mb-3">
            <label class="field-label">Usuário Aprovação</label>
            <input type="text" class="form-control form-control-sm field-readonly" readonly [value]="editData()!['usuarioAprovacao'] || ''" />
          </div>

          <div class="col-12 col-md-6 mb-3">
            <label class="field-label">Situação Lote</label>
            <input type="text" class="form-control form-control-sm field-readonly" readonly [value]="editData()!['situacaoLote'] || ''" />
          </div>
        }
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="onCancel()">
          {{ isViewMode ? 'Fechar' : 'Cancelar' }}
        </button>
        @if (!isViewMode) {
          <button type="submit" class="btn btn-primary btn-sm btn-submit">Salvar</button>
        }
      </div>
    </form>
  </div>
</div>
