<app-dynamic-filter
  title="Filtros"
  subtitle="PESQUISAR LOTE OUTROS CRÉDITOS/DÉBITOS"
  [filters]="filters"
  (search)="onSearch($event)"
></app-dynamic-filter>

<app-action-bar
  [actions]="actions"
  (actionClick)="onAction($event)"
></app-action-bar>

@if (tableData.length > 0) {
  <app-data-table
    [config]="tableConfig"
    [data]="tableData"
    (selectionChange)="onSelectionChange($event)"
    (pageChange)="onPageChange($event)"
  ></app-data-table>
}
