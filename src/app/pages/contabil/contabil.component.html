<app-dynamic-filter
  title="Filtros"
  subtitle="PESQUISAR LOTE OUTROS CRÉDITOS/DÉBITOS"
  [filters]="filters"
  (searchSubmit)="onSearch($event)"
></app-dynamic-filter>

<app-action-bar
  [actions]="actions()"
  (actionClick)="onAction($event)"
></app-action-bar>

@if (isLoading() && tableData().length === 0) {
  <app-loading></app-loading>
}

@if (tableData().length > 0) {
  <div class="table-wrapper" [class.loading-overlay-active]="isLoading()">
    @if (isLoading()) {
      <div class="table-loading-overlay">
        <app-loading></app-loading>
      </div>
    }
    <app-data-table
      [config]="tableConfig"
      [data]="tableData()"
      (selectionChange)="onSelectionChange($event)"
      (pageChange)="onPageChange($event)"
    ></app-data-table>
  </div>
}

@if (showModal()) {
  <app-modal-incluir
    [mode]="modalMode()"
    [editData]="modalEditData()"
    (save)="onModalSave($event)"
    (closeModal)="onModalClose()"
  ></app-modal-incluir>
}

@if (showJustificativaModal()) {
  <app-modal-justificativa
    [title]="justificativaTitle()"
    [readonly]="justificativaReadonly()"
    [text]="justificativaText()"
    (confirm)="onJustificativaConfirm($event)"
    (closeModal)="onJustificativaClose()"
  ></app-modal-justificativa>
}
