<div class="breadcrumb-container">
  <h1 class="breadcrumb-title">{{ breadcrumbs()[breadcrumbs().length - 1]?.label }}</h1>
  <nav class="breadcrumb-nav">
    <a class="breadcrumb-link" routerLink="/">Início</a>
    @for (item of breadcrumbs(); track item.url; let last = $last) {
      <span class="breadcrumb-separator">›</span>
      @if (last) {
        <span class="breadcrumb-link current">{{ item.label }}</span>
      } @else {
        <a class="breadcrumb-link" [routerLink]="item.url">{{ item.label }}</a>
      }
    }
  </nav>
</div>
